{% extends 'base.html' %}
{% block title %}Ishchini tahrirlash{% endblock %}
{% block page_title %}Ishchini tahrirlash{% endblock %}
{% block page_sub %}{{ worker.name }}{% endblock %}

{% block topbar_actions %}
<a href="{% url 'workers_list' %}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Orqaga</a>
{% endblock %}

{% block content %}
<div class="glass-panel">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">Ismi</label>
            <input type="text" name="name" class="form-control" value="{{ worker.name }}" required>
        </div>
        <div class="form-group">
            <label class="form-label">Telegram ID</label>
            <input type="text" name="telegram_id" class="form-control" value="{{ worker.telegram_id }}" required>
        </div>
        <div class="form-group">
            <label class="form-label">Roli</label>
            <select name="role" class="form-control">
                <option value="worker" {% if worker.role == 'worker' %}selected{% endif %}>Ishchi</option>
                <option value="boss" {% if worker.role == 'boss' %}selected{% endif %}>Boshliq</option>
                <option value="admin" {% if worker.role == 'admin' %}selected{% endif %}>Admin</option>
            </select>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
            <a href="{% url 'workers_list' %}" class="btn btn-secondary">Bekor qilish</a>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Saqlash</button>
        </div>
    </form>
</div>
{% endblock %}
